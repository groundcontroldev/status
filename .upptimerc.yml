# Ground Control public status page: https://status.groundcontroldev.com
# Upptime checks every site below every 5 minutes from GitHub Actions and publishes the page to GitHub Pages,
# so it keeps working when Railway or Supabase is down. Procedures: docs/status-page.md in gcd-app.
owner: groundcontroldev
repo: status

# Repository secrets the checks below may use (Settings → Secrets and variables → Actions). This list is the
# complete allowlist: a secret not named here never reaches a check.
secrets:
  - SUPABASE_PUBLISHABLE_KEY # Same value as the app's NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (production).

# Opened downtime issues are assigned here.
assignees:
  - mdeyo

# Slugs are referenced by maintenance issues (expectedDown) and incident labels; don't rename them.
sites:
  - name: Web app
    slug: web-app
    url: https://app.groundcontroldev.com/api/health
    maxResponseTime: 10000

  # Database reads its own field from the Web app's health route. That route also reports the internal services
  # (documentProcessing, drawingConversion), which stay off this page; a service customers call directly, such
  # as a public API, gets an entry here reading its field the same way.
  - name: Database
    slug: database
    url: https://app.groundcontroldev.com/api/health
    __dangerous__body_down_if_text_missing: '"database":"ok"'

  - name: Sign-in
    slug: sign-in
    url: https://data.groundcontroldev.com/auth/v1/health
    headers:
      - "apikey: $SUPABASE_PUBLISHABLE_KEY"

  - name: File storage
    slug: file-storage
    url: https://data.groundcontroldev.com/storage/v1/status

  - name: Website
    slug: website
    url: https://www.groundcontroldev.com

status-website:
  cname: status.groundcontroldev.com
  name: Ground Control Status
  # Ground Control colors and type (assets/theme.css, published at the site root). Fonts match the app and
  # www.groundcontroldev.com: Figtree for text, Space Grotesk for headings and nav.
  themeUrl: /theme.css
  links:
    - rel: preconnect
      href: https://fonts.gstatic.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap
  # Served from this repo, not the app, so the page keeps its logo while the app is down.
  logoUrl: https://raw.githubusercontent.com/groundcontroldev/status/master/assets/logo.png
  favicon: https://raw.githubusercontent.com/groundcontroldev/status/master/assets/logo.png
  introTitle: "**Ground Control** system status"
  # $OWNER/$REPO are only filled in for navbar links, so links in this text are written out in full.
  introMessage: >-
    Live availability of the Ground Control app and the services behind it, checked every 5 minutes, with
    scheduled maintenance and the history of past incidents. To get incident updates by email, sign in to
    GitHub and choose **Watch → Custom → Issues** on
    [this page's repository](https://github.com/groundcontroldev/status).
  navbar:
    - title: Status
      href: /
    - title: Ground Control
      href: https://www.groundcontroldev.com
    - title: Sign in
      href: https://app.groundcontroldev.com
    - title: Get updates
      href: https://github.com/$OWNER/$REPO
